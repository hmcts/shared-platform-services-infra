name: shared-platform-services-infra
trigger:
  batch: true
  branches:
    include:
      - main

pr:
  - main

resources:
  repositories:
    - repository: cnp-azuredevops-libraries
      type: github
      ref: refs/heads/master
      name: hmcts/cnp-azuredevops-libraries
      endpoint: "hmcts"

parameters:
  - name: overrideAction
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

  - name: envs
    type: object
    default:
      - name: sbox
        service_connection: "DTS-SPS-SBOX"
        depends_on: Precheck
      - name: dev
        service_connection: "DTS-SPS-PREVIEW"
        depends_on: Precheck
      - name: test
        service_connection: "DTS-SPS-PERFTEST"
        depends_on: Precheck
      - name: ithc
        service_connection: "DTS-SPS-ITHC"
        depends_on: Precheck
      - name: demo
        service_connection: "DTS-SPS-DEMO"
        depends_on: Precheck
      - name: stg
        service_connection: "DTS-SPS-STG"
        depends_on: Precheck
      - name: prod
        service_connection: "DTS-SPS-PROD"
        depends_on: Precheck

  - name: environment_components
    type: object
    default:
      - deployment: 'core'
        required_outputs:
          - resource_group
          - vnet_id
          - subnet_ids
      - deployment: "apim" # This is the name of the component's directory under /components
        environment: "sbox"
        depends_on: "core"
        pipeline_tests: false
      - deployment: "apim_appgw"
        environment: "sbox"
        depends_on: "apim"
        pipeline_tests: false
      # To add a component that consumes outputs from a prior component:
      #
      # - deployment: 'app_gateway'
      #   depends_on: 'core'              # ensures core is deployed first in the same env
      #   required_inputs:                # names of outputs from depends_on to consume; set as TF_VAR_ env vars
      #     - resource_group_name         # → TF_VAR_resource_group_name
      #     - subnet_id_app_gateway       # → TF_VAR_subnet_id_app_gateway

variables:
  - name: timeoutInMinutes
    value: 60
  - name: agentImage
    value: ubuntu-latest
  - name: product
    value: sps-platform
  - name: terraformInitSubscription
    value: 04d27a32-7a07-48b3-95b8-3c8691e1a263
  - template: vars/input-variables.yaml@cnp-azuredevops-libraries

stages:
  - stage: Precheck
    jobs:
      - job: Validate
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - template: steps/terraform-precheck.yaml@cnp-azuredevops-libraries
            parameters:
              keyvaultName: "infra-vault-nonprod"
              keyvaultSecret: "azure-devops-sp-token"
              serviceConnection: "azurerm-sandbox"
              overrideAction: ${{ parameters.overrideAction }}

  - ${{ each env in parameters.envs }}:
    - ${{ each deployment in parameters.environment_components }}:
      - ${{ if or(not(deployment.environment), eq(env.name, deployment.environment)) }}:
        - stage: ${{ env.name }}_${{ deployment.deployment }}
          dependsOn:
            # Component dependency — prerequisite component in the same environment
            - ${{ if deployment.depends_on }}:
              - ${{ env.name }}_${{ deployment.depends_on }}
            # Environment dependency — same component in the prerequisite environment
            - ${{ if eq(env.depends_on, 'Precheck') }}:
              - Precheck
            - ${{ if ne(env.depends_on, 'Precheck') }}:
              - ${{ env.depends_on }}_${{ deployment.deployment }}
          jobs:
            - job: TerraformPlanApply
              pool:
                vmImage: ${{ variables.agentImage }}
              timeoutInMinutes: ${{ variables.timeoutInMinutes }}
              # When a component consumes outputs from a dependency, map cross-stage
              # output variables into this job as TF_VAR_ environment variables so
              # terraform automatically picks them up without explicit -var flags.
              ${{ if deployment.required_inputs }}:
                variables:
                  ${{ each input in deployment.required_inputs }}:
                    TF_VAR_${{ input }}: $[ stageDependencies.${{ env.name }}_${{ deployment.depends_on }}.TerraformPlanApply.outputs['CaptureOutputs.${{ input }}'] ]
              steps:
                - template: steps/terraform.yaml@cnp-azuredevops-libraries
                  parameters:
                    overrideAction: ${{ parameters.overrideAction }}
                    environment: ${{ env.name }}
                    component: ${{ deployment.deployment }}
                    serviceConnection: ${{ env.service_connection }}
                    terraformInitSubscription: ${{ variables.terraformInitSubscription }}
                    product: ${{ variables.product }}
                    planCommandOptions: "-compact-warnings"
                # After terraform completes, capture specified outputs and publish
                # them as ADO output variables for downstream stages to consume
                # via stageDependencies.
                - ${{ if deployment.required_outputs }}:
                  - task: AzureCLI@2
                    name: CaptureOutputs
                    displayName: 'Publish terraform outputs'
                    inputs:
                      azureSubscription: ${{ env.service_connection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      addSpnToEnvironment: true
                      inlineScript: |
                        set -euo pipefail
                        COMPONENT_DIR="$(Build.SourcesDirectory)/shared-platform-services-infra/components/${{ deployment.deployment }}"
                        for OUTPUT_NAME in ${{ join(' ', deployment.required_outputs) }}; do
                          VALUE=$(terraform -chdir="$COMPONENT_DIR" output -json "$OUTPUT_NAME" | jq -cr '.')
                          echo "##vso[task.setvariable variable=${OUTPUT_NAME};isOutput=true]${VALUE}"
                        done
