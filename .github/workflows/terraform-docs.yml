name: Auto-Generate Terraform Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - "components/**/*.tf"
      - ".terraform-docs.yml"

# Only the push-back step needs write access; everything else is read-only.
permissions:
  contents: write

# Avoid piling up redundant runs/commits when a PR is updated rapidly.
concurrency:
  group: terraform-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-docs:
    # Skip forked PRs: GITHUB_TOKEN has no write access to the fork's branch.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render terraform-docs into README.md
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: .
          recursive: true
          recursive-path: components
          output-file: README.md
          output-method: inject
          git-push: false

      - name: Commit and push doc changes back to the PR branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-generate terraform-docs [skip ci]"
          file_pattern: "README.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
